# Construit la version statique du hub et la publie sur la branche `ovh-deploy`.
# L'hébergement OVH (alphabette.fr) est branché sur cette branche : il se met à
# jour tout seul après chaque push sur `main`.
name: Publier alphabette.fr

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Republication régulière : rafraîchit les données figées (actualités d'Info Perso…)
  schedule:
    - cron: '17 5-21/3 * * *'

permissions:
  contents: write

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build:static
        env:
          APPS_TOKEN: ${{ secrets.APPS_TOKEN }}
      - name: Ajouter la publication à la branche ovh-deploy
        # Historique linéaire obligatoire : OVH fait un « git pull » et refuse
        # les branches réécrites (pas de push --force ici).
        run: |
          git fetch origin ovh-deploy
          git worktree add ../publication origin/ovh-deploy
          cd ../publication
          git rm -rq --ignore-unmatch .
          cp -a "$GITHUB_WORKSPACE/dist-static/." .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -q -m "Publication du hub — ${GITHUB_SHA::7}"
            git push origin HEAD:ovh-deploy
          fi
