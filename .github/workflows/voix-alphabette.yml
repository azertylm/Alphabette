# Bibliothèque de voix Alphabette — GRATUITE, sans serveur.
# Chaque jour : construit le site, lit chaque page en largeur téléphone, enregistre les textes
# nouveaux — voix Gemini « Kore » si le secret GEMINI_API_KEY existe (quota gratuit de Google),
# sinon voix neuronale libre Piper « Siwis » (aucun compte, aucune limite) — puis range les MP3
# sur la branche voix-alphabette. deploy-ovh.yml les publie dans https://alphabette.fr/voix/.
name: Voix Alphabette — bibliothèque

on:
  schedule:
    - cron: '37 9 * * *'   # juste après la remise à zéro du quota Google (minuit, heure du Pacifique)
  workflow_dispatch:
    inputs:
      max:
        description: "Nombre maximal d'enregistrements (défaut 40)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: voix-alphabette
  cancel-in-progress: false

jobs:
  bibliotheque:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build:static
        env:
          APPS_TOKEN: ${{ secrets.APPS_TOKEN }}
      - name: Installer Playwright et ffmpeg
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1
          cd /tmp/pw && npx playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Installer la voix libre Piper (fr_FR-siwis-medium)
        # piper-tts (PyPI, version actuelle) : compatible avec les voix publiées aujourd'hui.
        run: |
          python3 -m pip install --quiet --user --break-system-packages piper-tts
          mkdir -p /tmp/piper && cd /tmp/piper
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium
          curl -fsSL -o siwis.onnx "$base/fr_FR-siwis-medium.onnx"
          curl -fsSL -o siwis.onnx.json "$base/fr_FR-siwis-medium.onnx.json"
          # Petit adaptateur : --model M --output_file F --length_scale L --sentence_silence S, texte sur l'entrée.
          cat > dire <<'SCRIPT'
          #!/usr/bin/env bash
          set -e
          while [ $# -gt 0 ]; do case "$1" in
            --model) M="$2"; shift 2;; --output_file) F="$2"; shift 2;;
            --length_scale) L="$2"; shift 2;; --sentence_silence) S="$2"; shift 2;; *) shift;; esac; done
          T="$(cat)"
          python3 -m piper -m "$M" -f "$F" --length-scale "${L:-1}" --sentence-silence "${S:-0.2}" -- "$T" 2>/dev/null \
            || python3 -m piper -m "$M" -f "$F" -- "$T"
          SCRIPT
          sed -i 's/^          //' dire && chmod +x dire
          echo "Bonjour, ceci est un essai." | ./dire --model siwis.onnx --output_file essai.wav --length_scale 1.12 --sentence_silence 0.35
          ls -l essai.wav
      - name: Reprendre la bibliothèque (branche voix-alphabette)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 origin voix-alphabette; then
            git worktree add -q ../voix-depot FETCH_HEAD
            cd ../voix-depot && git checkout -q -B voix-alphabette
          else
            git worktree add -q --detach ../voix-depot
            cd ../voix-depot && git checkout -q --orphan voix-alphabette && git rm -rqf . && rm -rf -- * .github 2>/dev/null || true
          fi
      - name: Collecter et enregistrer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright/index.js
          PIPER_BIN: /tmp/piper/dire
          PIPER_MODEL: /tmp/piper/siwis.onnx
          VOIX_MAX: ${{ github.event.inputs.max || '40' }}
        run: bun scripts/voix/generer-bibliotheque.ts --site dist-static --sortie ../voix-depot
      - name: Ranger et publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ../voix-depot
          git add -A voix
          if git diff --cached --quiet; then echo "Bibliothèque inchangée."; exit 0; fi
          git commit -q -m "Voix Alphabette — $(date -u +%F)"
          git push -q origin HEAD:voix-alphabette
          cd "$GITHUB_WORKSPACE"
          gh workflow run deploy-ovh.yml --ref main || echo "::warning::publication à la prochaine mise en ligne planifiée"
