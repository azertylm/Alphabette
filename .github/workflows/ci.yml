# Contrôle qualité à chaque push / pull request : lint (tsc), tests, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:a11y
      - name: Installer Playwright (à part des dépendances du site)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1
          cd /tmp/pw && npx playwright install --with-deps chromium
      - run: bun run test
        env:
          NODE_PATH: /tmp/pw/node_modules
      - run: bun run build
