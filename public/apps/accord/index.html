<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Accord n'est plus disponible — Alphabette</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font: 18px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f8fafc; color: #0f172a;
  }
  main { max-width: 32rem; text-align: center; }
  .logo { font-weight: 800; letter-spacing: .08em; color: #2563eb; font-size: 15px; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: .6em 0 .5em; }
  p { margin: 0 0 1.2em; color: #334155; }
  a.bouton {
    display: inline-block; padding: 14px 22px; border-radius: 12px;
    background: #2563eb; color: #fff; font-weight: 700; text-decoration: none;
  }
  a.bouton:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #f1f5f9; }
    p { color: #cbd5e1; }
    .logo { color: #93c5fd; }
  }
</style>
</head>
<body>
<main>
  <div class="logo">◉ ALPHABETTE</div>
  <h1>Accord n'est plus disponible</h1>
  <p>Cette application a été retirée pour le moment. Les autres applications d'Alphabette restent accessibles.</p>
  <a class="bouton" href="https://alphabette.fr/">Voir les applications Alphabette</a>
</main>
</body>
</html>
