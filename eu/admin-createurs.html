<!doctype html>
<html lang="fr">
<head>
    <script src="/labo/capteur.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Administration — validations et avis suspects</title>
<style>
:root{color-scheme:light dark;--f:#fff;--t:#1b1b1f;--d:#55555f;--b:#d6d6de;--a:#5b3df5;--c:#f5f5f8;--e:#b3261e;--ok:#146c2e}
@media (prefers-color-scheme:dark){:root{--f:#121216;--t:#f1f1f4;--d:#b8b8c4;--b:#34343e;--a:#a99bff;--c:#1d1d24;--e:#ff8a80;--ok:#7bd88f}}
*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--t);font:16px/1.45 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:10px 12px 60px}h1{font-size:24px}h2{font-size:19px;margin:0 0 6px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
nav a,button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);font:inherit;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
nav a[aria-current=page]{background:var(--a);border-color:var(--a);color:#fff}
.p{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}.danger{border-color:var(--e);color:var(--e)}
.carte{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}
input,textarea{width:100%;min-height:44px;padding:8px;font:inherit;border-radius:8px;border:1px solid var(--b);background:var(--f);color:var(--t)}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.msg{padding:8px 10px;border-radius:8px;border:1px solid var(--b);margin:8px 0}.err{border-color:var(--e);color:var(--e)}.ok{border-color:var(--ok);color:var(--ok)}
.petit{font-size:13px;color:var(--d);word-break:break-all}
.cadre{border:1px solid var(--b);border-radius:12px;overflow:hidden;margin:8px 0}
.cadre header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--c);border-bottom:1px solid var(--b)}
.cadre iframe{width:100%;height:60vh;border:0;background:#fff;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--b);padding:6px;text-align:left;vertical-align:top}
.suspect{background:#b3261e22}
</style>
</head>
<body>
<main>
<h1>Administration</h1>
<nav aria-label="Sections"><a href="/admin/validations" id="n-val">Validations</a><a href="/admin/avis-suspects" id="n-sus">Avis suspects</a></nav>
<div id="etat" role="status" aria-live="polite"></div>
<section id="login" class="carte" hidden>
  <form id="f-login"><label for="mdp"><strong>Mot de passe administrateur</strong></label>
  <input id="mdp" type="password" autocomplete="current-password"><p><button class="p" type="submit">Entrer</button></p></form>
</section>
<section id="contenu" hidden></section>
</main>
<script>
(function(){
'use strict';
var API='/api/createurs/',csrf=null,$=function(i){return document.getElementById(i)};
var onSus=/avis-suspects/.test(location.pathname);
$(onSus?'n-sus':'n-val').setAttribute('aria-current','page');
function msg(t,c){var e=$('etat');e.textContent='';if(!t)return;var d=document.createElement('div');d.className='msg '+(c||'');d.textContent=t;e.appendChild(d)}
function api(f,corps){var o={credentials:'same-origin'};if(corps){o.method='POST';o.headers={'Content-Type':'application/json','X-Alphabette':'1','X-CSRF':csrf||''};o.body=JSON.stringify(corps)}
  return fetch(API+f,o).then(function(r){return r.json().catch(function(){return {}}).then(function(d){return {s:r.status,d:d}})})}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(txt,cls,fn){var b=el('button',cls,txt);b.type='button';b.onclick=fn;return b}
function date(t){return new Date(t*1000).toLocaleString('fr-FR')}

function demarrer(){api('admin.php?session=1').then(function(r){
  if(r.d.connecte){csrf=r.d.csrf;$('login').hidden=true;$('contenu').hidden=false;onSus?avis():validations()}
  else{$('login').hidden=false;$('contenu').hidden=true;if(r.d.configure===false)msg("La console est fermée : définissez la variable ADMIN_PASSWORD sur l'hébergement.",'err')}})}
$('f-login').addEventListener('submit',function(e){e.preventDefault();api('admin.php',{action:'connexion',mot_de_passe:$('mdp').value}).then(function(r){$('mdp').value='';
  if(r.s===200){csrf=r.d.csrf;msg('');demarrer()}else msg(r.d.erreur||'Connexion impossible.','err')})});

function validations(){api('admin.php?validations=1').then(function(r){var c=$('contenu');c.textContent='';
  if(r.s!==200){msg(r.d.erreur||'Erreur','err');return}
  var k=el('div','carte');var h=el('h2',null,'Validation manuelle');k.appendChild(h);
  var cb=el('input');cb.type='checkbox';cb.id='manuel';cb.checked=r.d.reglages.requireManualValidation;cb.style.cssText='width:24px;height:24px;min-height:0;vertical-align:middle';
  var lb=el('label',null,' requireManualValidation : chaque dépôt est lu avant d\'entrer dans le Laboratoire');lb.setAttribute('for','manuel');
  cb.onchange=function(){api('admin.php',{action:'reglage',requireManualValidation:cb.checked}).then(function(x){msg(x.s===200?(x.d.requireManualValidation?'Validation manuelle activée.':'Validation manuelle DÉSACTIVÉE : les dépôts entrent directement.'):(x.d.erreur||'Erreur'),x.s===200?'ok':'err')})};
  k.appendChild(cb);k.appendChild(lb);k.appendChild(el('p','petit','Pionniers restants : '+r.d.pionniers_restants+' sur 50.'));c.appendChild(k);
  if(!r.d.en_attente.length)c.appendChild(el('p',null,'Aucune appli en attente.'));
  r.d.en_attente.forEach(function(a){var k=el('div','carte');k.appendChild(el('h2',null,a.nom+'  ·  par '+a.createur));
    k.appendChild(el('p',null,a.description||'(pas de description)'));
    k.appendChild(el('p','petit','Déposée le '+date(a.depuis)+' · '+a.type+' · '+a.categorie+' · '+a.source));
    k.appendChild(el('p','petit','SHA-256 de la version_originale : '+a.hashOriginal));
    if(a.apercu){var cad=el('div','cadre');var hd=el('header');hd.appendChild(el('strong',null,a.nom));hd.appendChild(el('span','petit','Aperçu isolé — cadre Alphabette (sandbox, sans allow-same-origin)'));cad.appendChild(hd);
      var f=document.createElement('iframe');f.title='Aperçu de '+a.nom;f.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-modals allow-downloads');f.setAttribute('referrerpolicy','no-referrer');f.loading='lazy';f.src='/'+a.apercu;cad.appendChild(f);k.appendChild(cad)}
    else k.appendChild(el('p','msg err',a.type==='github'?'Dépôt GitHub pas encore récupéré (GitHub indisponible à l\'envoi) : « Valider » réessaiera.':'Aucun aperçu.'));
    var m=el('textarea');m.placeholder='Motif du refus (montré au créateur)';m.setAttribute('aria-label','Motif du refus');m.maxLength=400;k.appendChild(m);
    var l=el('p');l.appendChild(btn('Valider','p',function(){api('admin.php',{action:'valider',id:a.id}).then(function(x){msg(x.s===200?'Validée'+(x.d.pionnier?' — badge Pionnier attribué.':'.'):(x.d.erreur||'Erreur'),x.s===200?'ok':'err');if(x.s===200)validations()})}));
    l.appendChild(document.createTextNode(' '));
    l.appendChild(btn('Refuser','danger',function(){if(m.value.trim().length<5){msg('Écrivez un motif de refus (5 caractères au moins).','err');m.focus();return}
      api('admin.php',{action:'refuser',id:a.id,motif:m.value}).then(function(x){msg(x.s===200?'Refusée : le créateur voit le motif.':(x.d.erreur||'Erreur'),x.s===200?'ok':'err');if(x.s===200)validations()})}));
    k.appendChild(l);c.appendChild(k)})})}

function avis(){api('admin.php?avis_suspects=1').then(function(r){var c=$('contenu');c.textContent='';
  if(r.s!==200){msg(r.d.erreur||'Erreur','err');return}
  c.appendChild(el('h2',null,'Alertes flag_security_review'));
  if(!r.d.alertes.length)c.appendChild(el('p',null,'Aucune alerte ouverte.'));
  r.d.alertes.forEach(function(a){var k=el('div','carte');k.appendChild(el('h2',null,a.nom+' ('+a.appId+')'));k.appendChild(el('p',null,a.motif+' — '+date(a.le)));
    var t=el('table');var th=el('tr');['Avis','Pseudo','Quand','Session','Réseau','Compte < 24 h','Valide',''].forEach(function(x){th.appendChild(el('th',null,x))});t.appendChild(th);
    a.votes.forEach(function(v){var tr=el('tr',v.compteRecent&&v.positif?'suspect':'');
      [v.positif?'Positif':'Négatif',v.pseudo,date(v.le),v.secondes+' s',v.reseau,v.compteRecent?'oui':'non',v.valide?'oui':'invalidé'].forEach(function(x){tr.appendChild(el('td',null,x))});
      var td=el('td');if(v.valide)td.appendChild(btn('Invalider','danger',function(){api('admin.php',{action:'invalider_vote',vote_id:v.id,motif:'avis frauduleux'}).then(function(x){msg(x.s===200?'Avis invalidé, compteurs recalculés : '+x.d.positifs+' positifs, '+x.d.negatifs+' négatifs.':(x.d.erreur||'Erreur'),x.s===200?'ok':'err');avis()})}));tr.appendChild(td);t.appendChild(tr)});
    var sc=el('div');sc.style.overflowX='auto';sc.appendChild(t);k.appendChild(sc);
    var l=el('p');l.appendChild(btn('Écarter l\'alerte','p',function(){api('admin.php',{action:'ecarter_alerte',flag_id:a.id}).then(function(x){msg(x.s===200?'Alerte écartée.':(x.d.erreur||'Erreur'),x.s===200?'ok':'err');avis()})}));
    l.appendChild(document.createTextNode(' '));l.appendChild(btn('Mettre en pause (abus)','danger',function(){api('admin.php',{action:'pause_abus',flag_id:a.id}).then(function(x){msg(x.s===200?'Appli mise en pause.':(x.d.erreur||'Erreur'),x.s===200?'ok':'err');avis()})}));
    k.appendChild(l);c.appendChild(k)});
  api('admin.php?signalements=1').then(function(s){c.appendChild(el('h2',null,'Signalements des visiteurs'));var l=s.d.signalements||[];if(!l.length)c.appendChild(el('p',null,'Aucun signalement ouvert.'));
    l.forEach(function(x){var k=el('div','carte');k.appendChild(el('p',null,x.appId+' — '+date(x.le)));k.appendChild(el('p',null,x.details));
      k.appendChild(btn('Écarter','p',function(){api('admin.php',{action:'ecarter_alerte',flag_id:x.id}).then(function(){avis()})}));k.appendChild(document.createTextNode(' '));
      k.appendChild(btn('Mettre en pause l\'appli','danger',function(){api('admin.php',{action:'pause_abus',flag_id:x.id}).then(function(){avis()})}));c.appendChild(k)})})})}
demarrer();
})();
</script>
</body>
</html>
