<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Merci — Alphabette</title>
<link rel="stylesheet" href="/labo/pages.css">
<style>
  .carte-cadeau { background: #fffdf7; color: #1c1917; border: 3px solid #0f766e; border-radius: 1.2rem; padding: 1.4rem; margin: 1rem 0; }
  .carte-cadeau * { color: #1c1917; }
  .carte-cadeau .marque { font-size: 1rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #0f766e; }
  .carte-cadeau h2 { font-size: 1.7rem; margin: .4rem 0 .6rem; }
  .carte-cadeau .offre { font-size: 1.2rem; font-weight: 700; }
  .carte-cadeau .code { display: block; margin: 1rem 0; padding: .8rem .4rem; border: 2px dashed #0f766e; border-radius: .8rem; text-align: center;
    font: 800 min(1.6rem, 5.2vw)/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .03em; white-space: nowrap; }
  .carte-cadeau .ligne { display: flex; gap: .5rem; align-items: baseline; margin: .4rem 0; font-size: 1.15rem; }
  .carte-cadeau .ligne input { flex: 1; min-height: 44px; margin: 0; border: 0; border-bottom: 2px solid #a8a29e; border-radius: 0; background: transparent; color: #1c1917; font-size: 1.15rem; }
  .carte-cadeau ol { margin: .4rem 0 0; padding-left: 1.4rem; font-size: 1.05rem; }
  .carte-cadeau .mot { font-size: 1.2rem; font-style: italic; margin: .6rem 0; }
  @media print {
    @page { size: A5 landscape; margin: 8mm; }
    body { background: #fff; font-size: 12pt; }
    body * { visibility: hidden; }
    .carte-cadeau, .carte-cadeau * { visibility: visible; }
    .carte-cadeau { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 6mm 8mm; border-width: 2pt; break-inside: avoid; }
    .carte-cadeau .marque { font-size: 10pt; }
    .carte-cadeau h2 { font-size: 20pt; margin: 1mm 0 2mm; }
    .carte-cadeau .offre { font-size: 13pt; margin: 0 0 2mm; }
    .carte-cadeau .ligne { font-size: 13pt; margin: 1mm 0; }
    .carte-cadeau .ligne input { min-height: 0; padding: 1mm 2mm; border-bottom: 1pt solid #78716c; font-size: 13pt; }
    .carte-cadeau .ligne input:placeholder-shown::placeholder { color: transparent; }
    .carte-cadeau input:focus, .carte-cadeau input:focus-visible { outline: none; }
    .carte-cadeau .mot { font-size: 13pt; margin: 2mm 0; }
    .carte-cadeau .code { font-size: 20pt; margin: 3mm 0; padding: 2mm; }
    .carte-cadeau ol { font-size: 12pt; margin: 0; }
    .carte-cadeau .petit { font-size: 10pt; margin: 2mm 0 0; }
  }
</style>
</head>
<body>
<main>
  <a class="retour" href="/">← Le Laboratoire Alphabette</a>
  <h1 id="titre">Vérification du paiement…</h1>
  <p class="message" id="m" role="status">Un instant, nous demandons confirmation à Stripe.</p>
  <div id="contenu"></div>
  <footer class="pied">
    <a href="/pass/">Les Pass</a>
    <a href="/apps/iadebat/">IA Débat</a>
    <a href="/#tableau-honneur">Tableau d'Honneur</a>
    <a href="/conditions-de-vente">CGV</a>
  </footer>
</main>
<script src="/labo/pass.js"></script>
<script>
(function () {
  var P = window.AlphabettePass;
  var $ = function (id) { return document.getElementById(id); };
  // Le numéro de paiement sert de preuve d'achat : on le retire de l'adresse (historique, partage d'écran).
  var sid = new URLSearchParams(location.search).get('session_id') || '';
  try {
    if (sid) { sessionStorage.setItem('alphabette_session_paiement', sid); history.replaceState(null, '', location.pathname); }
    else sid = sessionStorage.getItem('alphabette_session_paiement') || '';
  } catch (e) { /* stockage indisponible */ }
  var essais = 0;
  function el(tag, attrs, texte) { var n = document.createElement(tag); Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); }); if (texte != null) n.textContent = texte; return n; }
  function para(texte, cls) { var p = el('p', cls ? { class: cls } : {}); p.textContent = texte; return p; }
  function titre(t) { $('titre').textContent = t; }
  function message(t, cls) { $('m').className = 'message ' + (cls || ''); $('m').textContent = t; }

  async function verifier(app) {
    if (!/^cs_(test|live)_/.test(sid)) { titre('Paiement introuvable'); message('Cette page s’ouvre après un paiement. Rien n’a été débité.', 'err'); return; }
    var r = await P.confirmer(sid, app);
    if (r.statut === 402 && r.d.en_attente && essais < 8) { essais++; message('Paiement en cours de confirmation par la banque…'); setTimeout(verifier, 5000); return; }
    if (!r.ok) { titre('Presque !'); message((r.d.erreur || 'Vérification impossible.') + ' Votre paiement est enregistré chez Stripe : vous recevez aussi un e-mail.', 'err'); return; }
    var c = $('contenu'); c.textContent = '';
    var d = r.d;
    if (d.type === 'choisir_app') {
      titre('Quelle application ?'); message('Votre Pass « une application » est payé : choisissez-la (une seule fois).');
      var f = el('form', { class: 'carte' }); var s = el('select', { 'aria-label': 'Application du Pass' });
      Object.keys(d.applis).forEach(function (k) { s.appendChild(el('option', { value: k }, d.applis[k])); });
      var b = el('button', { type: 'submit' }, 'Valider ce choix');
      f.appendChild(s); f.appendChild(el('div', { class: 'actions' })).appendChild(b);
      f.addEventListener('submit', function (ev) { ev.preventDefault(); b.disabled = true; verifier(s.value); });
      c.appendChild(f); return;
    }
    if (d.type === 'pass') {
      titre('Merci, votre Pass est actif !'); message('');
      var k = el('div', { class: 'carte carte--acc' });
      k.appendChild(para('✅ ' + P.nomOffre(d) + ' jusqu’au ' + P.dateFr(d.fin) + '. Aucun renouvellement automatique : rien ne sera prélevé à la fin.'));
      k.appendChild(para('Pour l’utiliser sur un autre appareil (' + d.appareils + ' au plus) : page des Pass, « J’ai un code cadeau », puis ce code (aussi envoyé par e-mail) :'));
      k.appendChild(el('pre', { class: 'code' }, d.code));
      c.appendChild(k);
      c.appendChild(el('div', { class: 'actions' })).appendChild(el('a', { class: 'bouton', href: d.app && d.app !== 'iadebat' ? '/' : '/apps/iadebat/' }, d.app && d.app !== 'iadebat' ? 'Ouvrir les applications' : 'Ouvrir IA Débat'));
      return;
    }
    if (d.type === 'cadeau') {
      titre('Merci ! Voici votre carte cadeau'); message('Le code vous a aussi été envoyé par e-mail.');
      var carte = el('section', { class: 'carte-cadeau', 'aria-label': 'Carte cadeau à imprimer' });
      carte.appendChild(el('div', { class: 'marque' }, 'Alphabette · carte cadeau'));
      carte.appendChild(el('h2', {}, 'Un an d’applications, offert'));
      carte.appendChild(el('p', { class: 'offre' }, d.offre === 'ecosysteme' ? 'Pass Écosystème : toutes les applications Alphabette' : 'Pass ' + (d.app_nom || 'Application') + ' : 12 mois'));
      var l1 = el('div', { class: 'ligne' }); l1.appendChild(el('span', {}, 'Pour :')); l1.appendChild(el('input', { 'aria-label': 'Pour', placeholder: 'prénom' })); carte.appendChild(l1);
      var l2 = el('div', { class: 'ligne' }); l2.appendChild(el('span', {}, 'De la part de :')); l2.appendChild(el('input', { 'aria-label': 'De la part de', placeholder: 'prénom' })); carte.appendChild(l2);
      if (d.message) carte.appendChild(el('p', { class: 'mot' }, '« ' + d.message + ' »'));
      carte.appendChild(el('span', { class: 'code' }, d.code));
      var ol = el('ol');
      ['Aller sur alphabette.eu/pass', 'Toucher « J’ai un code cadeau »', 'Taper le code ci-dessus : c’est tout !'].forEach(function (t) { ol.appendChild(el('li', {}, t)); });
      carte.appendChild(ol);
      carte.appendChild(para('12 mois à partir de l’activation · à activer avant le ' + P.dateFr(d.activer_avant) + ' · aucun renouvellement automatique · ' + d.appareils + ' appareils', 'petit'));
      c.appendChild(carte);
      var a = c.appendChild(el('div', { class: 'actions' }));
      var bi = el('button', { type: 'button' }, '🖨️ Imprimer la carte'); bi.addEventListener('click', function () { if (document.activeElement) document.activeElement.blur(); window.print(); }); a.appendChild(bi);
      var bc = el('button', { type: 'button', class: 'secondaire' }, 'Copier le code');
      bc.addEventListener('click', async function () { try { await navigator.clipboard.writeText(d.code); bc.textContent = '✅ Copié'; } catch (e) { bc.textContent = d.code; } });
      a.appendChild(bc);
      return;
    }
    if (d.type === 'credits') {
      titre('Merci, vos crédits sont ajoutés !'); message('');
      var k2 = el('div', { class: 'carte carte--acc' });
      k2.appendChild(para('✅ ' + d.ajoutes + ' débats Premium ajoutés. Solde : ' + d.solde + ' crédit(s). Ils n’expirent pas.'));
      if (d.porte_monnaie) {
        k2.appendChild(para('Gardez ce code : il retrouve vos crédits sur un autre appareil (page des Pass, « J’ai un code ») :'));
        k2.appendChild(el('pre', { class: 'code' }, d.porte_monnaie));
      }
      c.appendChild(k2);
      c.appendChild(el('div', { class: 'actions' })).appendChild(el('a', { class: 'bouton', href: '/apps/iadebat/' }, 'Retour à IA Débat'));
      return;
    }
    titre('Merci pour votre soutien !'); message('');
    var k3 = el('div', { class: 'carte carte--acc' });
    k3.appendChild(para('💚 Votre soutien de ' + String(d.montant).replace('.', ',') + ' € paie l’hébergement et les crédits d’IA du Laboratoire. C’est un don ponctuel : rien d’autre ne sera prélevé.'));
    if (d.pseudo) k3.appendChild(para('« ' + d.pseudo + ' » apparaît dans le Tableau d’Honneur.'));
    c.appendChild(k3);
    c.appendChild(el('div', { class: 'actions' })).appendChild(el('a', { class: 'bouton', href: '/#tableau-honneur' }, 'Voir le Tableau d’Honneur'));
  }
  verifier();
})();
</script>
</body>
</html>
