    <!-- Design Pop / Néon : univers (.eu Labo / .fr Vitrine) et Mode Calme posés avant l'affichage (aucun flash). -->
    <script>
      (function () {
        var r = document.documentElement;
        r.dataset.univers = /(^|\.)alphabette\.eu$/i.test(location.hostname) || /[?&]labo(=|&|$)/.test(location.search) ? 'labo' : 'vitrine';
        try { if (localStorage.getItem('alphabette.calme') === 'oui') r.dataset.calme = 'oui'; } catch (e) {}
        // Mode Codex (parchemin) : alphabette.eu seulement, activé par défaut, interrupteur dans « Mon compte ».
        try { if (r.dataset.univers === 'labo' && localStorage.getItem('alphabette.codex') !== 'non') r.setAttribute('data-ab-codex', 'oui'); } catch (e) {}
      })();
    </script>

      <h1>Le Laboratoire Alphabette</h1>
      <p>Testez en avant-première les applications d'Alphabette (IA Débat, Info Perso, France Service, jeux et outils du quotidien), donnez votre avis en un clic et aidez à les améliorer. Gratuit, sans inscription.</p>
      <ul>
        <li><a href="/info.html">ALPHABETTE INFO</a> — Vos flux d'actualités dans une page calme, avec dix outils pour creuser chaque article.</li>
        <li><a href="/apps/bonplan/">BON PLAN</a> — Des trouvailles utiles du quotidien, rangées par thème. Votez pour vos préférées, ajoutez les vôtres.</li>
        <li><a href="/apps/ecobatisol/">ÉCOBÂTISOL</a> — Autonomie solaire et récupération d'eau de pluie, chiffrées pour votre maison.</li>
        <li><a href="/quiz-femmes/">FEMMES EXTRAORDINAIRES</a> — Plus de 300 questions sur les femmes qui ont changé le monde : science, arts, droits, résistance, sport. À plusieurs sur un seul écran.</li>
        <li><a href="/apps/frigoplacard/">FRIGO-PLACARD</a> — Zéro gaspi : ce qu'il reste dans votre frigo devient des recettes, une liste de courses et des idées.</li>
        <li><a href="/quiz-extraordinaires/">GENS EXTRAORDINAIRES</a> — Quiz à plusieurs : de Gaulle, Mitterrand, Martin Luther King, Bourvil, de Funès… 239 anecdotes vraies que presque personne ne connaît.</li>
        <li><a href="/apps/goatchevretheking/">Goat Chèvre The King</a> — Élisez vos légendes du football, classez-les en pyramide et comparez avec les autres.</li>
        <li><a href="/apps/iadebat/">IADÉBAT</a> — Six intelligences artificielles débattent en direct d'un sujet de société, sous vos yeux.</li>
        <li><a href="/apps/infosperso/">INFOS PERSO</a> — Un portail d'actualités à votre goût, avec des résumés et des approfondissements.</li>
        <li><a href="/apps/atelier/">L'ŒIL DE L'ATELIER</a> — Des outils d'IA pour artistes et galeries : curation, organisation de vernissages, estimation de marché.</li>
        <li><a href="/dico-loufoque/">LE DICO LOUFOQUE</a> — Un mot rare, quatre définitions dont trois inventées pour rire : trouvez la vraie.</li>
        <li><a href="/juste-chiffre/">LE JUSTE CHIFFRE</a> — Devinez un chiffre réel au plus près : hauteurs, dates, distances. Chaque réponse cite sa source.</li>
        <li><a href="/memo-meninges/">MÉMO-MÉNINGES</a> — Cinq minutes de petits jeux de mémoire et de calcul par jour, avec de gros boutons et sans chronomètre.</li>
        <li><a href="/apps/omnistat/">OmniStats</a> — Classements et statistiques historiques multi-sports (F1, football, NBA, NHL) pour clubs et nations, mis à jour chaque nuit.</li>
        <li><a href="/orbit/">ORBIT</a> — Vos vidéos YouTube, TikTok, Instagram et Facebook sans algorithme : vous dosez la découverte, filtrez par durée réelle et un minuteur doux arrête le défilement.</li>
        <li><a href="/ou-cest/">OÙ C'EST ?</a> — Un lieu étonnant, une carte du monde : posez le doigt où vous pensez qu'il est. Plus vous êtes près, plus vous marquez.</li>
        <li><a href="/ou-cest-france/">OÙ C'EST EN FRANCE ?</a> — Dix lieux de France, célèbres ou savoureux : touchez la carte à l'endroit où vous pensez qu'ils se trouvent.</li>
        <li><a href="/petits-jeux/">PETITS JEUX</a> — Des petits jeux pour s'amuser et apprendre : mots rares, chiffres à deviner, mémoire, légendes du football.</li>
        <li><a href="/podcasts/">PODCASTS</a> — Un lecteur de podcasts simple : cherchez, abonnez-vous, réglez la vitesse, reprenez où vous vous êtes arrêté. Sans pub, sans compte.</li>
        <li><a href="/apps/promptmagic/">PROMPT MAGIC</a> — Décrivez une idée d'application utile : Prompt Magic en fait un cahier des charges prêt à construire.</li>
        <li><a href="/apps/proxilien/">PROXILIEN</a> — Entraide et lien entre seniors et jeunes à La Grande-Motte, sur téléphone, ordinateur ou télévision.</li>
        <li><a href="/quiz-famille/">QUIZ EN FAMILLE</a> — Un quiz loufoque à plusieurs sur un seul écran : films cultes, humoristes, répliques. Une anecdote à chaque réponse.</li>
        <li><a href="/quiz-musique/">QUIZ MUSIQUE</a> — Années 60 à 90 : Amérique, France, monde entier. Des histoires vraies d'artistes engagés, à plusieurs sur un seul écran.</li>
        <li><a href="/apps/revolution/">RÉVOLUTION</a> — Les questions de l'actualité du moment et celles des syndicats, associations et citoyens : répondez en un geste.</li>
        <li><a href="/apps/bonplansenior/">SENIOR BON PLAN</a> — Santé, droits, aides, sorties, arnaques : 150 conseils vérifiés pour bien vivre après 60 ans.</li>
        <li><a href="/apps/franceservice/">SERVICE FRANCE</a> — Le portail citoyen de vos papiers : points de permis, amendes et démarches, expliqués simplement.</li>
        <li><a href="/wikicom/">WIKICOM</a> — L'annuaire des bons outils du web : des sites et des logiciels utiles, libres et légaux.</li>
        <li><a href="/crash-testeur/">Le Crash-Testeur</a> — N'importe quel site testé en 30 secondes : note sur 100 (téléphone, vitesse, accessibilité, sécurité) et les 3 points à corriger en premier.</li>
        <li><a href="/createurs/c-tranche-vite/">Tranche-Vite</a> — Application de test du Collectif Alphabette (Salle d'embarquement).</li>
      </ul>
      <p>Les versions validées sont sur <a href="https://alphabette.fr/">alphabette.fr</a>.</p>
