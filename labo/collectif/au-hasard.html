<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Une application au hasard — Collectif Alphabette</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #f1f5f9; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 32rem; padding: 1.5rem; text-align: center; }
  a { color: #5eead4; font-weight: 800; }
</style>
</head>
<body>
<main>
  <p id="m" role="status">On vous emmène vers une autre application du collectif…</p>
  <p><a href="/">Voir toutes les applications</a></p>
</main>
<script>
(async () => {
  const m = document.getElementById('m');
  const depuis = (new URLSearchParams(location.search).get('depuis') || '').toLowerCase();
  try {
    const r = await fetch('/api/apps.json', { cache: 'no-store' });
    const { apps = [] } = await r.json();
    const vers = (a) => new URL(a.url, location.origin);
    const candidates = apps.filter((a) => {
      if (!a.url || a.groupe || (a.status && a.status !== 'actif')) return false;
      const u = vers(a);
      const cle = (u.hostname + u.pathname).toLowerCase();
      // Jamais l'application d'où l'on vient (même adresse, ou page à l'intérieur de cette application).
      return !(depuis && (depuis.startsWith(cle) || (u.pathname === '/' && depuis.split('/')[0] === u.hostname.toLowerCase())));
    });
    if (!candidates.length) throw new Error('vide');
    const choix = candidates[Math.floor(Math.random() * candidates.length)];
    m.textContent = `Direction : ${choix.name}…`;
    location.replace(vers(choix).href);
  } catch {
    m.textContent = 'Impossible de tirer une application au hasard pour le moment.';
  }
})();
</script>
</body>
</html>
