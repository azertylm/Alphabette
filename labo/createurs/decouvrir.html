<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Découvrir les applis du Collectif | Laboratoire Alphabette</title>
<meta name="description" content="Pionniers, nouveautés et applis à un pas d'alphabette.fr : cherchez et essayez les applications de créateurs indépendants du Laboratoire Alphabette.">
<link rel="canonical" href="https://alphabette.eu/decouvrir/">
<meta property="og:type" content="website"><meta property="og:locale" content="fr_FR"><meta property="og:site_name" content="Le Laboratoire Alphabette">
<meta property="og:title" content="Découvrir les applis du Collectif Alphabette">
<meta property="og:description" content="Les applications de créateurs indépendants, notées par la communauté.">
<meta property="og:url" content="https://alphabette.eu/decouvrir/"><meta property="og:image" content="https://alphabette.eu/og-image.png">
<meta name="twitter:card" content="summary">
<style>
:root{color-scheme:light dark;--f:#fff;--t:#1b1b1f;--d:#55555f;--b:#d6d6de;--a:#5b3df5;--c:#f5f5f8}
@media (prefers-color-scheme:dark){:root{--f:#121216;--t:#f1f1f4;--d:#b8b8c4;--b:#34343e;--a:#a99bff;--c:#1d1d24}}
html[data-ab-calme] *{animation:none!important;transition:none!important}
*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--t);font:17px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:12px 14px 60px}a{color:var(--a)}h1{font-size:26px}h2{font-size:21px;margin:1.6em 0 .4em}
input[type=search]{width:100%;min-height:48px;padding:10px;font:inherit;border-radius:12px;border:1px solid var(--b);background:var(--f);color:var(--t)}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.cats button{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--t);font:inherit;cursor:pointer}
.cats button[aria-pressed=true]{background:var(--a);border-color:var(--a);color:#fff}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
ul{list-style:none;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
li{border:1px solid var(--b);border-radius:14px;background:var(--c);padding:12px 14px}li strong a{text-decoration:none}
.b{display:inline-block;padding:1px 10px;border-radius:99px;border:1px solid var(--a);font-size:14px;margin-left:4px}.petit{font-size:14px;color:var(--d)}
.barre{height:8px;border-radius:99px;background:var(--b);overflow:hidden;margin-top:6px}.barre span{display:block;height:100%;background:var(--a)}
</style>
</head>
<body>
<main>
<p><a href="/">← Le Laboratoire</a> · <a href="/soumettre/">Publier mon appli</a></p>
<h1>Découvrir les applis du Collectif</h1>
<label for="q" class="petit">Rechercher une appli ou un créateur</label>
<input id="q" type="search" placeholder="Quiz, cuisine, jeu…" autocomplete="off">
<div class="cats" id="cats" role="group" aria-label="Catégories"></div>
<div id="resultats" hidden><h2>Résultats</h2><ul id="l-res"></ul></div>
<div id="blocs">
  <section id="s-pion"><h2>Pionniers &amp; coups de projecteur</h2><ul id="l-pion"></ul></section>
  <section id="s-new"><h2>Nouveautés</h2><ul id="l-new"></ul></section>
  <section id="s-presque"><h2>À un pas d'Alphabette.fr</h2><p class="petit">Entre 6 et 9 avis positifs, au moins 75 % d'avis favorables : encore un petit coup de pouce.</p><ul id="l-presque"></ul></section>
</div>
</main>
<script>
(function(){
'use strict';
var API='/api/createurs/catalogue.php',$=function(i){return document.getElementById(i)},cat='',minuteur=null;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function carte(a){var li=el('li');var s=el('strong');var l=el('a',null,a.nom);l.href=a.url;s.appendChild(l);li.appendChild(s);
  if(a.pionnier)li.appendChild(el('span','b','Pionnier'));
  li.appendChild(el('p',null,a.description||''));
  var p=el('p','petit');p.appendChild(document.createTextNode('par '));var c=el('a',null,a.createur);c.href='/createur/'+encodeURIComponent(a.createur)+'/';p.appendChild(c);p.appendChild(document.createTextNode(' · '+a.categorie+' · '+a.positifs+' avis positif'+(a.positifs>1?'s':'')));li.appendChild(p);
  var br=el('div','barre');br.setAttribute('role','img');br.setAttribute('aria-label',a.positifs+' avis positifs sur 10 requis');var sp=el('span');sp.style.width=Math.min(100,a.positifs*10)+'%';br.appendChild(sp);li.appendChild(br);return li}
function remplir(id,liste,vide){var u=$(id);u.textContent='';if(!liste.length){var li=el('li','petit',vide);u.appendChild(li);return}liste.forEach(function(a){u.appendChild(carte(a))})}
function blocs(){fetch(API+'?blocs=1').then(function(r){return r.json()}).then(function(d){
  remplir('l-pion',(d.pionniers||[]).concat(d.projecteur||[]),'Les premières applis arrivent bientôt.');remplir('l-new',d.nouveautes||[],'Aucune appli pour le moment.');remplir('l-presque',d.presque||[],'Aucune appli à ce stade pour le moment.');
  var c=$('cats');if(!c.children.length){['Toutes'].concat(d.categories||[]).forEach(function(n){var b=el('button',null,n);b.type='button';b.setAttribute('aria-pressed',String(n==='Toutes'));b.onclick=function(){cat=n==='Toutes'?'':n;Array.prototype.forEach.call(c.children,function(x){x.setAttribute('aria-pressed',String(x===b))});chercher()};c.appendChild(b)})}
  }).catch(function(){remplir('l-pion',[],'Service indisponible pour le moment.')})}
function chercher(){var q=$('q').value.trim();if(!q&&!cat){$('resultats').hidden=true;$('blocs').hidden=false;return}
  fetch(API+'?q='+encodeURIComponent(q)+'&cat='+encodeURIComponent(cat)).then(function(r){return r.json()}).then(function(d){$('blocs').hidden=true;$('resultats').hidden=false;remplir('l-res',d.apps||[],'Aucune appli ne correspond.')})}
$('q').addEventListener('input',function(){clearTimeout(minuteur);minuteur=setTimeout(chercher,180)});
blocs();
})();
</script>
</body>
</html>
