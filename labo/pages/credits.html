<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hall of Fame — merci aux contributeurs · Alphabette</title>
<meta name="description" content="Les personnes qui améliorent les applis du Laboratoire Alphabette : statuts, contributions, badge Pilier.">

<link rel="stylesheet" href="/labo/pages.css">
<style>.cache{display:none!important}.message{min-height:1.5em;font-weight:700}.message.ok{color:var(--ok)}.message.err{color:var(--err)}table{width:100%;border-collapse:collapse}td,th{padding:.5rem .3rem;border-top:1px solid var(--trait);text-align:left;color:var(--encre)}</style>
</head>
<body>
<script src="/assets/alphabette-barre.js" data-cle="credits" data-nom="Merci !" data-sous-titre="Hall of Fame" data-accent="#4338ca"></script>
<script src="/labo/lot5.js"></script>
<main id="contenu">
  <a class="retour" href="/">← Le Laboratoire Alphabette</a>
  <h1>Hall of Fame</h1>
  <p class="chapeau">Celles et ceux qui testent, signalent et imaginent. Seuls les pseudos sont affichés ; chacun peut se retirer de la liste depuis <a href="/contribuer/">sa page Labo</a>.</p>
  <table><thead><tr><th>#</th><th>Pseudo</th><th>Statut</th><th>Contributions</th></tr></thead><tbody id="t"><tr><td colspan="4">Chargement…</td></tr></tbody></table>
</main>
<script>
(function () {
  var A = window.AB5;
  A.labo('communaute.php', null, 'hall=1').then(function (d) {
    var t = A.$('t'); t.textContent = '';
    var l = d.contributeurs || [];
    if (!l.length) { t.appendChild(A.el('tr', {}, [A.el('td', { colspan: '4', text: d._s === 200 ? 'La liste attend ses premiers noms : contribuez !' : (d.erreur || 'Indisponible.') })])); return; }
    l.forEach(function (c, i) { t.appendChild(A.el('tr', {}, [A.el('td', { text: String(i + 1) }), A.el('td', { text: c.pseudo + (c.pilier ? ' 🏛️' : '') }), A.el('td', { text: c.statut }), A.el('td', { text: String(c.contributions) })])); });
  });
})();
</script>
</body>
</html>
