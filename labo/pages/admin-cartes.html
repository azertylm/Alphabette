<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartes offertes — administration Alphabette</title><meta name="robots" content="noindex, nofollow">
<style>body{font:17px/1.5 system-ui,sans-serif;max-width:860px;margin:0 auto;padding:16px}input{font:inherit;padding:10px;width:100%;box-sizing:border-box}button{font:inherit;font-weight:700;padding:12px 18px;margin:8px 8px 8px 0;border:0;border-radius:10px;background:#4338ca;color:#fff;min-height:44px}button.p{padding:8px 12px;margin:0;min-height:44px}table{border-collapse:collapse;width:100%;margin-bottom:18px}td,th{border-bottom:1px solid #e2e8f0;padding:6px;text-align:left}h2{font-size:20px;margin:18px 0 6px}</style></head>
<body><h1>Cartes offertes</h1>
<label>Mot de passe administrateur <input id="mdp" type="password" autocomplete="current-password"></label>
<button id="v">Voir le tableau de bord</button><button id="x">Télécharger en CSV</button>
<p id="s" role="status"></p>
<h2>Par lieu / lot <small>(nommez un lot : « Marché de Lunel », « Salon seniors »…)</small></h2><table id="lots"></table>
<h2>Scans et activations par source <small>(lien de la carte avec <code>&amp;s=nom-du-lieu</code>)</small></h2><table id="src"></table>
<h2>Défi « 3 amis »</h2><p id="defi"></p><table id="defis"></table>
<h2>Mur de remerciements <small>(masquer un prénom)</small></h2><table id="mur"></table>
<script>
var $=function(i){return document.getElementById(i)};
function get(q){return fetch('/api/carte.php?'+q,{headers:{'X-Admin-Password':$('mdp').value}})}
function post(o){return fetch('/api/carte.php?admin',{method:'POST',headers:{'X-Admin-Password':$('mdp').value,'Content-Type':'application/json'},body:JSON.stringify(o)}).then(function(r){return r.json()})}
function cell(tr,t){var td=tr.insertCell();td.textContent=t;return td}
function tete(t,cols){t.innerHTML='';var tr=t.insertRow();cols.forEach(function(c){var th=document.createElement('th');th.textContent=c;tr.appendChild(th)})}
function voir(){get('admin').then(function(r){return r.json().then(function(d){
  if(!r.ok){$('s').textContent=d.erreur||'Erreur';return}
  $('s').textContent=d.utilisees+' carte(s) activée(s) sur '+d.total+' — '+d.restantes+' restante(s).';
  tete($('lots'),['Lot','Libellé','Activées / total','']);
  d.parLot.forEach(function(l){var tr=$('lots').insertRow();cell(tr,l.lot);var i=document.createElement('input');i.value=l.libelle;i.setAttribute('aria-label','Libellé du lot '+l.lot);tr.insertCell().appendChild(i);
    cell(tr,l.utilisees+' / '+l.total);var b=document.createElement('button');b.className='p';b.textContent='Enregistrer';b.onclick=function(){post({action:'libelle',lot:l.lot,libelle:i.value}).then(function(x){$('s').textContent=x.ok?'Libellé enregistré.':(x.erreur||'Erreur')})};tr.insertCell().appendChild(b)});
  tete($('src'),['Source','Scans','Activations']);
  d.parSource.forEach(function(x){var tr=$('src').insertRow();cell(tr,x.source);cell(tr,x.scans);cell(tr,x.activations)});
  $('defi').textContent=d.defisValides+' défi(s) réussi(s) — '+d.amisActives+' ami(s) activé(s) au total.';
  tete($('defis'),['Carte','2ᵉ appli','']);
  d.recentes.filter(function(c){return c.defi_le}).forEach(function(c){var tr=$('defis').insertRow();cell(tr,c.lot+'-'+c.numero+(c.email?' ('+c.email+')':''));cell(tr,c.defi_livre_le?'livrée':'à offrir');
    var td=tr.insertCell();if(!c.defi_livre_le){var b=document.createElement('button');b.className='p';b.textContent='Marquer livrée';b.onclick=function(){post({action:'livrer',lot:c.lot,numero:c.numero}).then(voir)};td.appendChild(b)}});
  tete($('mur'),['Carte','Prénom','']);
  d.recentes.filter(function(c){return c.mur}).forEach(function(c){var tr=$('mur').insertRow();cell(tr,c.lot+'-'+c.numero);cell(tr,c.prenom+(c.masque?' (masqué)':''));
    var b=document.createElement('button');b.className='p';b.textContent=c.masque?'Réafficher':'Masquer';b.onclick=function(){post({action:'masquer',lot:c.lot,numero:c.numero,masque:c.masque?0:1}).then(voir)};tr.insertCell().appendChild(b)})
})})}
$('v').onclick=voir;
$('x').onclick=function(){get('export').then(function(r){return r.ok?r.blob():null}).then(function(b){if(!b){$('s').textContent='Mot de passe incorrect.';return}var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cartes-activees.csv';a.click()})};
</script></body></html>
