<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>21 h 13 en direct — le journal du Laboratoire Alphabette (format vertical)</title>
<meta name="description" content="Format vertical 9:16 du journal du Laboratoire : un problème repéré, la correction publiée par le passage des agents. Pour les vidéos courtes.">
<style>
  :root { --fond: #0b1220; --encre: #f8fafc; --doux: #cbd5e1; --acc: #5eead4; --soir: #c4b5fd; --matin: #fde68a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--encre); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .cadre { position: relative; width: min(100vw, calc(100vh * 9 / 16)); height: min(100vh, calc(100vw * 16 / 9)); overflow: hidden;
    background: radial-gradient(120% 70% at 85% 0%, #1e3a5f 0%, transparent 60%), radial-gradient(90% 60% at 0% 100%, #3b1f5e 0%, transparent 60%), var(--fond);
    display: flex; flex-direction: column; padding: 6% 7% 5%; font-size: calc(min(100vw, 100vh * 9 / 16) / 22); }
  .progres { display: flex; gap: .3em; }
  .progres span { flex: 1; height: .22em; border-radius: 9em; background: #ffffff33; overflow: hidden; }
  .progres span i { display: block; height: 100%; width: 0; background: #fff; }
  .entete { display: flex; justify-content: space-between; align-items: center; margin-top: .9em; font-weight: 800; font-size: .8em; color: var(--doux); }
  .titre { font-size: 1.5em; font-weight: 900; line-height: 1.05; margin: .5em 0 0; letter-spacing: -.02em; }
  .titre em { font-style: normal; color: var(--soir); }
  .app { margin-top: 1em; display: inline-block; align-self: flex-start; font-weight: 900; font-size: .9em; padding: .25em .7em; border-radius: 9em; background: #ffffff1f; }
  .bloc { margin-top: .8em; border-radius: .8em; padding: .8em .9em; background: #ffffff12; border: 1px solid #ffffff22; }
  .bloc small { display: block; font-weight: 900; font-size: .62em; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .35em; }
  .bloc p { margin: 0; font-size: .95em; line-height: 1.3; font-weight: 650; }
  .bloc--avant small { color: var(--matin); }
  .bloc--apres { background: #5eead41f; border-color: #5eead466; }
  .bloc--apres small { color: var(--acc); }
  .fleche { text-align: center; font-size: 1.4em; margin: .25em 0 -.2em; color: var(--acc); }
  .bas { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; font-weight: 900; }
  .bas .site { color: var(--acc); font-size: .95em; }
  .bas .petit { color: var(--doux); font-weight: 600; font-size: .62em; text-align: right; }
  .vide { margin: auto 0; font-size: 1em; color: var(--doux); }
  .commandes { position: fixed; right: .6rem; bottom: .6rem; display: flex; gap: .4rem; z-index: 2; }
  .commandes button, .commandes a { min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid #ffffff44; background: #000000aa; color: #fff; font: 700 15px system-ui, sans-serif; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; padding: 0 .7rem; }
  .commandes button:focus-visible, .commandes a:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
  body.capture .commandes { display: none; }
  .anime { animation: entre .5s ease-out both; }
  @keyframes entre { from { opacity: 0; transform: translateY(.6em); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .anime { animation: none; } }
</style>
</head>
<body>
<div class="cadre" id="cadre" aria-live="polite">
  <div class="progres" id="progres" aria-hidden="true"></div>
  <div class="entete"><span>🌙 21 h 13 en direct</span><span id="date"></span></div>
  <h1 class="titre">Repéré,<br><em>puis corrigé.</em></h1>
  <div id="fiche" style="display:flex;flex-direction:column"></div>
  <div class="bas"><span class="site">alphabette.eu</span><span class="petit">Le Laboratoire<br>des applis utiles</span></div>
</div>
<div class="commandes">
  <button type="button" id="prec" aria-label="Fiche précédente">‹</button>
  <button type="button" id="pause" aria-label="Pause">❚❚</button>
  <button type="button" id="suiv" aria-label="Fiche suivante">›</button>
  <button type="button" id="capture" title="Cacher ces boutons pour filmer l'écran (touche Échap pour les retrouver)">🎬 Filmer</button>
  <a href="/" aria-label="Retour au Laboratoire">✕</a>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var ORIGINES = { avis: '☀️ Avis d’un visiteur', controle: '🔎 Contrôle automatique', atelier: '🧪 Atelier qualité', chaos: '🌀 Agent Chaos' };
  var DUREE = 7000, fiches = [], i = 0, minuteur = null, debut = 0, enPause = false;
  var lent = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(tag, cls, t) { var n = document.createElement(tag); if (cls) n.className = cls; if (t != null) n.textContent = t; return n; }
  function nomLisible(n) {
    if (n !== n.toUpperCase()) return n;
    return n.toLowerCase().split(/(\s+|-|'|’)/).map(function (m, k) {
      if (k === 0 && m.indexOf('ia') === 0 && m.length > 2) return 'IA ' + m.charAt(2).toUpperCase() + m.slice(3);
      if (k > 0 && ['de', 'du', 'des', 'la', 'le', 'les', 'et', 'l', 'd'].indexOf(m) >= 0) return m;
      return m.charAt(0).toUpperCase() + m.slice(1);
    }).join('');
  }
  function montrer(n) {
    if (!fiches.length) return;
    i = (n + fiches.length) % fiches.length;
    var f = fiches[i], z = $('fiche'); z.textContent = '';
    var a = el('span', 'app' + (lent ? '' : ' anime'), f.app); z.appendChild(a);
    var av = el('div', 'bloc bloc--avant' + (lent ? '' : ' anime')); av.appendChild(el('small', null, ORIGINES[f.origine] || '🔎 Repéré')); av.appendChild(el('p', null, f.probleme)); z.appendChild(av);
    z.appendChild(el('div', 'fleche', '↓'));
    var ap = el('div', 'bloc bloc--apres' + (lent ? '' : ' anime')); ap.style.animationDelay = '.35s';
    ap.appendChild(el('small', null, '✅ Corrigé · passage du ' + f.quand)); ap.appendChild(el('p', null, f.amelioration)); z.appendChild(ap);
    $('date').textContent = (i + 1) + ' / ' + fiches.length;
    Array.prototype.forEach.call($('progres').children, function (s, k) { s.firstChild.style.width = k < i ? '100%' : '0'; });
    debut = performance.now();
  }
  function tic(t) {
    if (!enPause && fiches.length) {
      var p = Math.min(1, (t - debut) / DUREE);
      var s = $('progres').children[i]; if (s) s.firstChild.style.width = (p * 100) + '%';
      if (p >= 1) montrer(i + 1);
    }
    minuteur = requestAnimationFrame(tic);
  }
  $('prec').onclick = function () { montrer(i - 1); };
  $('suiv').onclick = function () { montrer(i + 1); };
  $('pause').onclick = function () {
    enPause = !enPause; this.textContent = enPause ? '▶' : '❚❚'; this.setAttribute('aria-label', enPause ? 'Lecture' : 'Pause');
    if (!enPause) debut = performance.now();
  };
  $('capture').onclick = function () { document.body.classList.add('capture'); };
  $('cadre').onclick = function () { if (document.body.classList.contains('capture')) return; montrer(i + 1); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.body.classList.remove('capture');
    if (e.key === 'ArrowRight') montrer(i + 1);
    if (e.key === 'ArrowLeft') montrer(i - 1);
    if (e.key === ' ') { e.preventDefault(); $('pause').click(); }
  });

  fetch('/api/labo/changelog-labo.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }).then(function (d) {
    return fetch('/api/apps.json').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }).then(function (a) { return [d, a]; });
  }).then(function (x) {
    var noms = {}; ((x[1] && x[1].apps) || []).forEach(function (a) { noms[a.id] = nomLisible(a.name || a.id); });
    noms.podcasts = noms.podcasts || 'Podcasts';
    var apps = (x[0] && x[0].apps) || {};
    Object.keys(apps).forEach(function (id) {
      var e = apps[id], quand = e.passage ? new Date(e.passage).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', timeZone: 'Europe/Paris' }) : '';
      (e.changements || []).forEach(function (c) {
        if (c.probleme && c.amelioration) fiches.push({ app: noms[id] || id, probleme: c.probleme, amelioration: c.amelioration, origine: c.origine, quand: quand, t: e.passage || '' });
      });
    });
    fiches.sort(function (a, b) { return b.t.localeCompare(a.t); });
    if (!fiches.length) { $('fiche').appendChild(el('p', 'vide', 'Aucune correction publiée pour l’instant. Le prochain passage des agents, c’est ce soir à 21 h 13.')); return; }
    fiches.forEach(function () { var s = el('span'); s.appendChild(el('i')); $('progres').appendChild(s); });
    montrer(0);
    minuteur = requestAnimationFrame(tic);
  });
})();
</script>
</body>
</html>
